name: Build and Publish Binary Distribution

on:
  release:
    types: [published] # Triggers when you create a new release
  
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push to the binary repo

    steps:
    - name: Checkout Direct Repo
      uses: actions/checkout@v4
      with:
        path: direct-repo

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cython setuptools py-obfuscate

    - name: Prepare compiled source
      working-directory: ./direct-repo
      run: |
        # 1. Obfuscate source code into a temporary directory
        cp -r src/ obfuscated_src/
        py-obfuscate --in-place --remove-docstrings obfuscated_src/ || echo "Obfuscation failed, continuing without it."
        
        # 2. Compile the obfuscated code
        # Temporarily replace src with the obfuscated version to run setup.py
        mv src src_original
        mv obfuscated_src src
        
        python setup.py build_ext --inplace
        
        # 3. Clean up source files, leaving only compiled binaries, __init__.py, and type hints
        find src -type f \( -name "*.py" ! -name "__init__.py" \) -delete
        find src -type f -name "*.c" -delete
        find src -type f -name "*.pyc" -delete

        # 4. Move the result to a new directory and restore original source
        mv src compiled_src
        mv src_original src

    - name: Publish to Binary Repo
      run: |
        # Set up a new git repo in a temporary directory
        git clone "https://x-access-token:${{ secrets.BINARY_REPO_PAT }}@github.com/nommu-moose/monpy_binary" binary-repo
        cd binary-repo
        
        # Configure git user for the commit
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # If the repo was empty, we need to be on a branch
        git checkout -b main || git checkout main

        # Clear old files from the binary repo
        git rm -rf ./* || true
        
        # Copy the compiled source tree and project files, preserving the src layout
        mkdir -p src
        cp -r ../direct-repo/compiled_src/monpy ./src/
        cp ../direct-repo/pyproject.toml .
        cp ../direct-repo/README.md .
        cp ../direct-repo/LICENSE .

        echo "--- Git status before commit ---"
        git status
        
        # Commit and push the new version
        git add .
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "Publish binary release for tag ${{ github.ref_name }}"
          
          # Push the main branch, overwriting its history
          git push --set-upstream -f origin main
          
          # Create and push a tag that matches the release, overwriting it if it exists
          git tag -f ${{ github.ref_name }}
          git push -f origin refs/tags/${{ github.ref_name }}
        else
          echo "No changes to commit."
        fi
